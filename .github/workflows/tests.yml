name: scientific-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q
      - run: ruff check src tests validation
      - run: python validation/generate_cli_reference.py --check
      - run: python validation/check_docs.py
      - run: python -m build
  fortran:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S vasp-plugin -B build/fortran
      - run: cmake --build build/fortran
      - run: ctest --test-dir build/fortran --output-on-failure
